spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_ticket}
    username: ${DB_USERNAME:${USER:lei}}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.aiticket.server: debug
