server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: ai-ticket-server
  config:
    import: optional:classpath:application-local.yml

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss


sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${SA_TOKEN_TIMEOUT:86400}
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-64
  is-log: false


mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

  configuration:
    map-underscore-to-camel-case: true

  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0


springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html


minio:
  enabled: false
  endpoint:
  access-key:
  secret-key:
  bucket: ai-ticket


ai:
  enabled: ${AI_ENABLED:false}

  provider: ${AI_PROVIDER:}
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  chat-model: ${AI_CHAT_MODEL:}
  embedding-model: ${AI_EMBEDDING_MODEL:}

  agent:
    frontend-path: ${AI_AGENT_FRONTEND_PATH:}
    backend-path: ${AI_AGENT_BACKEND_PATH:}
    log-path: ${AI_AGENT_LOG_PATH:./logs}

    enable-command-exec: false
    enable-file-write: false
    enable-real-deploy: false


rabbitmq:
  enabled: false


logging:
  level:
    root: info
    com.aiticket.server: info
